name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  scan:
    name: SonarQube Cloud scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Advisory only: the scan step is skipped until the repo is connected
    # on SonarQube Cloud and the SONAR_TOKEN secret is added (see #78).
    # Note: the secrets context is not allowed in `if:`, so the secret
    # is mirrored into env here, which is allowed in `if:`.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        if: env.SONAR_TOKEN != ''
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Run tests with coverage
        # pytest-cov is not a project dependency; --with adds it just for
        # this run so the scanner gets a coverage report. --frozen keeps
        # the locked test environment untouched.
        if: env.SONAR_TOKEN != ''
        run: uv run --frozen --with pytest-cov pytest --cov=taken --cov-report=xml
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: sonarsource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8
