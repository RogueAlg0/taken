name: Auto-update PR branches

on:
  push:
    branches: [main]

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    # Least privilege for auto_update_prs.py: update-branch pushes to PR
    # branches (contents: write); listing PRs only reads (was write).
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update stale PR branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/workflows/auto_update_prs.py
