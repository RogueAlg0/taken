name: bump-tap

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# After a release tag is pushed and the sdist is live on PyPI, bump the
# Homebrew tap formula and open a PR in RogueAlg0/homebrew-taken-tap.
#
# The bump refreshes the sdist url/sha256 AND regenerates the vendored
# dependency resources via .github/scripts/resolve_tap_resources.py, because
# Homebrew's virtualenv_install_with_resources installs each resource with
# pip --no-deps.
#
# Needs a TAP_BUMP_PAT secret: fine-grained PAT with Contents and
# Pull requests write access on the tap repo. Without it the job skips
# with a warning instead of failing.

jobs:
  bump:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check for the tap PAT
        id: pat
        run: |
          if [ -z "${{ secrets.TAP_BUMP_PAT }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAP_BUMP_PAT is not set; skipping the Homebrew tap bump."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the sdist on PyPI
        if: steps.pat.outputs.present == 'true'
        id: pypi
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if JSON=$(curl -sf "https://pypi.org/pypi/taken-gh/${VER}/json"); then
              break
            fi
            echo "waiting for taken-gh ${VER} on PyPI (attempt $i/30)..."
            sleep 20
          done
          if [ -z "${JSON:-}" ]; then
            echo "::error::taken-gh ${VER} never appeared on PyPI" >&2
            exit 1
          fi
          eval "$(python3 - "$JSON" <<'EOF'
          import json, shlex, sys
          urls = json.loads(sys.argv[1])["urls"]
          sdist = next(u for u in urls if u["packagetype"] == "sdist")
          print(f"SDIST_URL={shlex.quote(sdist['url'])}")
          print(f"SDIST_SHA256={shlex.quote(sdist['digests']['sha256'])}")
          EOF
          )"
          echo "sdist_url=${SDIST_URL}" >> "$GITHUB_OUTPUT"
          echo "sdist_sha256=${SDIST_SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pat.outputs.present == 'true'
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pat.outputs.present == 'true'
        with:
          repository: RogueAlg0/homebrew-taken-tap
          token: ${{ secrets.TAP_BUMP_PAT }}
          path: tap

      - name: Bump formula and open PR
        if: steps.pat.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_BUMP_PAT }}
        run: |
          VER="${{ steps.pypi.outputs.version }}"
          URL="${{ steps.pypi.outputs.sdist_url }}"
          SHA="${{ steps.pypi.outputs.sdist_sha256 }}"
          BRANCH="bump-${VER}"
          cd tap
          if git ls-remote --heads origin "${BRANCH}" | grep -q .; then
            echo "Bump branch ${BRANCH} already exists; skipping."
            exit 0
          fi
          git checkout -b "${BRANCH}"
          python3 -m pip install --quiet --break-system-packages --require-hashes -r "${GITHUB_WORKSPACE}/.github/requirements-resolver.txt"
          python3 "${GITHUB_WORKSPACE}/.github/scripts/resolve_tap_resources.py" \
            "${VER}" /tmp/tap-resources.json
          python3 "${GITHUB_WORKSPACE}/.github/scripts/rewrite_tap_formula.py" \
            "Formula/taken.rb" /tmp/tap-resources.json "${URL}" "${SHA}" "${VER}"
          git add Formula/taken.rb
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Bump taken to ${VER}"
          git push -u origin "${BRANCH}"
          gh pr create --repo RogueAlg0/homebrew-taken-tap \
            --base main --head "${BRANCH}" \
            --title "Bump taken to ${VER}" \
            --body "Automated formula bump for the v${VER} release: sdist URL and sha256 synced from PyPI, and the vendored dependency resources regenerated with .github/scripts/resolve_tap_resources.py (extras-aware closure, pinned sdist URLs and sha256)."
