name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Run ruff check
        run: uv run --frozen ruff check
      - name: Run ruff format check
        run: uv run --frozen ruff format --check
      - name: Run tests
        run: uv run --frozen pytest

  smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build wheel
        run: uv build
      - name: Install wheel into a fresh venv
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
      - name: Smoke test the installed entry point
        run: |
          BIN=/tmp/smoke-venv/bin/taken
          $BIN --version
          $BIN --help
          set +e
          $BIN not-a-target >/dev/null 2>&1
          code=$?
          set -e
          test "$code" -eq 3
