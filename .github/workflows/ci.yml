name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run ruff check
        run: uv run --frozen ruff check
      - name: Run ruff format check
        run: uv run --frozen ruff format --check
      - name: Run tests
        run: uv run --frozen pytest -n auto --cov=taken --cov-report=term-missing
      - name: Run mypy
        run: uv run --frozen mypy taken/

  smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build wheel
        run: uv build
      - name: Install wheel into a fresh venv
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
      - name: Smoke test the installed entry point
        run: |
          BIN=/tmp/smoke-venv/bin/taken
          $BIN --version
          $BIN --help
          set +e
          $BIN not-a-target >/dev/null 2>&1
          code=$?
          set -e
          test "$code" -eq 3
      - name: Smoke test taken-mcp starts and speaks MCP
        run: |
          set +e
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' | timeout 30 /tmp/smoke-venv/bin/taken-mcp >/tmp/taken-mcp-out.txt 2>/tmp/taken-mcp-err.txt
          code=$?
          set -e
          test "$code" -eq 0
          grep -q '"jsonrpc"' /tmp/taken-mcp-out.txt

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: REUSE lint
        run: uvx reuse lint

  docs-sync:
    name: Docs pipeline copies in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check vendored docs copies match taken/
        run: |
          fail=0
          for pair in "taken/checks.py docs/py/checks.py" "taken/verdict.py docs/py/verdict.py"; do
            set -- $pair
            if ! diff -q "$1" "$2" > /dev/null; then
              echo "::error::$2 is out of sync with $1"
              diff "$1" "$2" | head -20
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo 'Re-copy with: cp taken/checks.py docs/py/checks.py && cp taken/verdict.py docs/py/verdict.py'
            exit 1
          fi
