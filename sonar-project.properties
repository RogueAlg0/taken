sonar.organization=roguealg0
sonar.projectKey=RogueAlg0_taken

sonar.sources=taken
sonar.tests=tests

# docs/py holds vendored byte-copies of the taken package for the browser
# console; analyzing both would double-count everything.
sonar.exclusions=docs/py/**

# Coverage report produced by the "Run tests with coverage" step in the
# SonarQube workflow; feeds the "coverage on new code" Quality Gate.
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
