[project]
name = "taken-gh"
version = "0.5.0"
description = "Check whether a GitHub issue is already taken before you volunteer for it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "RogueAlg0" }]
keywords = ["github", "cli", "open-source"]
urls = { Homepage = "https://roguealg0.github.io/taken/", Repository = "https://github.com/RogueAlg0/taken" }
dependencies = [
    "tqdm>=4.66",
    "mcp>=2.0,<3",
]

[project.scripts]
taken = "taken.cli:main"
taken-mcp = "taken.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taken"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
