[project]
name = "taken-gh"
version = "0.7.2"
description = "Check whether a GitHub issue is already taken before you volunteer for it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "RogueAlg0" }]
keywords = ["github", "cli", "open-source", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
urls = { Homepage = "https://roguealg0.github.io/taken/", Repository = "https://github.com/RogueAlg0/taken" }
dependencies = [
    "tqdm>=4.66",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.0,<3",
]

[project.scripts]
taken = "taken.cli:main"
taken-mcp = "taken.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "ruff>=0.8",
    "mypy>=1.0",
    "types-tqdm",
    # Optional at runtime (taken-gh[mcp]), but the test suite covers it.
    "mcp>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taken"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 85

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
